            - USDCAD=/work/development-pipeline-v2/sha256-c8903538bf0c2a81cd866e318e4eb6ac0a8abf21fedd96eee8b10322ebf41758/symbols/USDCAD/features-full.parquet
            - --feature
            - USDJPY=/work/development-pipeline-v2/sha256-c8903538bf0c2a81cd866e318e4eb6ac0a8abf21fedd96eee8b10322ebf41758/symbols/USDJPY/features-full.parquet
            - --label
