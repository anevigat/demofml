            - --label
            - USDJPY=/work/development-pipeline-v2/sha256-c8903538bf0c2a81cd866e318e4eb6ac0a8abf21fedd96eee8b10322ebf41758/symbols/USDJPY/labels-full.parquet
            - --output
            - /work/campaign2-cross-pair-historical-screen-2020-v1/report.json
            - --code-reference
            - sha256:051c4c7106a4149d1e9f5a497329eae25aec22b422c87c0e7496340a8a524df5
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: 1Gi
