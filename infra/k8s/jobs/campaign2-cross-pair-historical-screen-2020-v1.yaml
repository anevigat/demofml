            - --label
            - EURJPY=/work/development-pipeline-v2/sha256-c8903538bf0c2a81cd866e318e4eb6ac0a8abf21fedd96eee8b10322ebf41758/symbols/EURJPY/labels-full.parquet
            - --label
            - EURUSD=/work/development-pipeline-v2/sha256-c8903538bf0c2a81cd866e318e4eb6ac0a8abf21fedd96eee8b10322ebf41758/symbols/EURUSD/labels-full.parquet
            - --label
            - GBPJPY=/work/development-pipeline-v2/sha256-c8903538bf0c2a81cd866e318e4eb6ac0a8abf21fedd96eee8b10322ebf41758/symbols/GBPJPY/labels-full.parquet
            - --label
            - GBPUSD=/work/development-pipeline-v2/sha256-c8903538bf0c2a81cd866e318e4eb6ac0a8abf21fedd96eee8b10322ebf41758/symbols/GBPUSD/labels-full.parquet
            - --label
