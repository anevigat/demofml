apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demofml-campaign2-engineering-verify-deny-all
  namespace: demofml
  labels:
    app.kubernetes.io/name: campaign2-engineering-verify
    app.kubernetes.io/part-of: demofml
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: campaign2-engineering-verify
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: batch/v1
kind: Job
metadata:
  name: demofml-campaign2-v2-engineering-verify-v1
  namespace: demofml
  labels:
    app.kubernetes.io/name: campaign2-engineering-verify
    app.kubernetes.io/part-of: demofml
    demofml.io/campaign: prospective-cross-pair-factor-v2
  annotations:
    demofml.io/image: anevigat/demofml@sha256:532da0c8cf3f8f4f26c6f24bd6c90c8182330b5449a94a536c6e711fcbfc74f9
    demofml.io/source-revision: 0e151c56990e93f919b4c1e0f643702dba1ecc7a
    demofml.io/image-workflow-run: "30997221106"
    demofml.io/custody-scope: onprem-only
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 1209600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: campaign2-engineering-verify
        app.kubernetes.io/part-of: demofml
        demofml.io/campaign: prospective-cross-pair-factor-v2
    spec:
      restartPolicy: Never
      serviceAccountName: demofml-workload
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        intechsol.com/workload: demofml
      tolerations:
        - key: intechsol.com/workload
          operator: Equal
          value: demofml
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify
          image: anevigat/demofml@sha256:532da0c8cf3f8f4f26c6f24bd6c90c8182330b5449a94a536c6e711fcbfc74f9
          imagePullPolicy: IfNotPresent
          args:
            - verify-campaign2-engineering
            - --config
            - /opt/demofml/configs/prospective/campaign-2-engineering-v2.toml
            - --code-reference
            - sha256:532da0c8cf3f8f4f26c6f24bd6c90c8182330b5449a94a536c6e711fcbfc74f9
            - --base-image-reference
            - anevigat/demofml@sha256:532da0c8cf3f8f4f26c6f24bd6c90c8182330b5449a94a536c6e711fcbfc74f9
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
